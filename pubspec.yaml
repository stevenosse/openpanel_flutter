name: openpanel_flutter
description: "OpenPanel analytics for Flutter. A wrapper around the official OpenPanel Kotlin and Swift SDKs for Android and iOS."
version: 0.3.0
homepage: https://github.com/stevenosse/openpanel_flutter
repository: https://github.com/stevenosse/openpanel_flutter
issue_tracker: https://github.com/stevenosse/openpanel_flutter/issues
topics:
  - analytics
  - openpanel

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  equatable: ^3.0.0
  referrer: ^1.1.0
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  plugin:
    platforms:
      android:
        package: dev.openpanel.openpanel_flutter
        pluginClass: OpenpanelFlutterPlugin
      ios:
        pluginClass: OpenpanelFlutterPlugin
